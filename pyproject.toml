[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myprintfade"
version = "2.0.0"
description = "Next-gen 24-bit TrueColor terminal fade engine, TUI widgets, and MCP visual telemetry server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "k11E3R" }
]
keywords = ["terminal", "ansi", "fade", "cli", "tui", "mcp", "agents", "truecolor"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]
dependencies = []

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
myprintfade = "myprintfade.cli:main"
myprintfade-mcp = "myprintfade.mcp_server:run_server"

[project.urls]
Homepage = "https://github.com/k11E3R/myprintfade"
Repository = "https://github.com/k11E3R/myprintfade"
